clocks:
  hse:
    default_hz: 8000000
    startup_timeout: 48000
  mhsi:
    hz: 8000000
  fhsi:
    hz: 48000000
    notes: Internal high-speed oscillator, WB32-specific (not present in STM32F10x)
  lsi:
    hz: 40000
  lse:
    hz: 32768
flash:
  controller: FMC
  sector_size: 256
  page_program_size: 256
  notes: Different register layout than STM32 FPEC controller
electrical:
  vdd_min: 2.0
  vdd_max: 3.6
  vdda_min: 2.0
  vdda_max: 3.6
  vdda_adc_min: 2.4
  vdda_adc_max: 3.6
  vbat_min: 1.8
  vbat_max: 3.6
  temperature_range:
  - -40
  - 85
  f_hclk_max_mhz: 96
  f_pclk1_max_mhz: 96
  f_pclk2_max_mhz: 96
  package_dimensions:
    package: LQFP48
    body:
    - 7.0
    - 7.0
    pin_count: 48
bootloader:
  rom_dfu: true
  flash_start_address: 0x8000000
  usb_vid: 0x342D
  notes:
  - Westberry Technology USB DFU bootloader, stored in ROM and not erasable.
  - Entry via QMK QK_BOOT keycode, BOOT button held at reset, or NVIC_SystemReset() with bootloader flag.
  _reason: Documented in docs/bootloader.md; not present in vendor headers, ChibiOS port, or datasheet PDFs.
errata:
- id: dma-lli-reserved
  severity: high
  summary: DMA Linked-List-Item (LLP) register reserved despite STM32-similar struct layout
  workaround: Use auto-reload or ISR-chained transfers instead of LLI mode
  _reason: Documented in docs/errata.md and confirmed by examples/dma-multi-transfer.
- id: gpio-speed-encoding
  severity: low
  summary: GPIO output speed has two levels (LOW/HIGH) with encoding inverted relative to STM32
  workaround: Use the vendor SDK macros, not STM32-style raw register writes
  _reason: Documented in docs/chip-overview.md and validated via examples/pin-validation.
development_hardware:
  taobao_url: https://world.taobao.com/dianpu/471165391.htm
  reworked_from: WB32F104RC dev board with WB32FQ95xC replacement
  _reason: From README.md 'Development Hardware' section.
